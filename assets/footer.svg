<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="135" viewBox="0 0 1200 135" preserveAspectRatio="none" role="img" aria-label="Animated pink to purple wave footer">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B01650"/>
      <stop offset="50%" stop-color="#E0457B"/>
      <stop offset="100%" stop-color="#C9B3F2"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E0457B" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#C9B3F2" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#B01650" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9B3F2" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#E0457B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#B01650" stop-opacity="0.38"/>
    </linearGradient>
  </defs>

  <!-- Back wave (slowest) -->
  <path fill="url(#waveGrad3)">
    <animate attributeName="d" dur="14s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      values="
        M0,42 C240,105 460,5 720,48 C960,92 1080,18 1200,42 L1200,135 L0,135 Z;
        M0,52 C240,8 480,100 720,42 C960,12 1080,92 1200,52 L1200,135 L0,135 Z;
        M0,42 C240,105 460,5 720,48 C960,92 1080,18 1200,42 L1200,135 L0,135 Z
      "/>
  </path>

  <!-- Middle wave (medium speed, opposite phase) -->
  <path fill="url(#waveGrad2)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      values="
        M0,64 C280,12 520,112 800,58 C1000,20 1110,88 1200,64 L1200,135 L0,135 Z;
        M0,56 C280,110 520,18 800,72 C1000,105 1110,28 1200,56 L1200,135 L0,135 Z;
        M0,64 C280,12 520,112 800,58 C1000,20 1110,88 1200,64 L1200,135 L0,135 Z
      "/>
  </path>

  <!-- Front wave (fastest, main gradient) -->
  <path fill="url(#waveGrad1)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      values="
        M0,84 C320,125 600,42 900,88 C1060,112 1140,70 1200,84 L1200,135 L0,135 Z;
        M0,88 C320,45 600,122 900,76 C1060,52 1140,105 1200,88 L1200,135 L0,135 Z;
        M0,84 C320,125 600,42 900,88 C1060,112 1140,70 1200,84 L1200,135 L0,135 Z
      "/>
  </path>
</svg>